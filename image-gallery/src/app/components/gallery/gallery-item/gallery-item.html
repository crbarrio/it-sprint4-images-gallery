<div>
    <img 
    [class.selected-border]="isSelected()" 
    (click)="onImageClick()"
    class="h-40 w-full rounded-xl object-cover shadow-sm transition-transform duration-300 hover:scale-[1.02] hover:cursor-pointer sm:h-48 lg:h-52" 
    src="{{ image().src }}" 
    alt=" {{ image().alt }}">
</div>
