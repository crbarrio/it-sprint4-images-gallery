
<div class="card mx-auto w-full max-w-160">
    <p-galleria [value]="images()" [responsiveOptions]="responsiveOptions" [containerStyle]="{ 'max-width': '640px', 'margin': '0 auto' }" [numVisible]="5">
        <ng-template #item let-item>
            <img [src]="item.src" [alt]="item.alt" style="width:100%" />
        </ng-template>
        <ng-template #thumbnail let-item>
            <img [src]="item.src" [alt]="item.alt" />
        </ng-template>
    </p-galleria>
</div>
